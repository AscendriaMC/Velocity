# Reindeer: mccrypt/Cargo.lock -> third-party/rust/BUCK. Run `just lock-rust` after touching
# mccrypt's dependencies. "Hybrid" mode: the manifest IS mccrypt's, so there is no pseudo-package
# to keep in sync; mccrypt itself is built by the hand-written mccrypt/BUCK.
manifest_path = "mccrypt/Cargo.toml"
third_party_dir = "third-party/rust"

# Not vendored: sources are fetched from crates.io by sha256 at build time, the same way
# third-party/jvm fetches jars.

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""
generated_file_header = """
##
## @generated by reindeer via `just lock-rust` -- do not edit by hand.
##
"""
