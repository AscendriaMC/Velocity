[package]
name = "junit-runner"
version = "0.1.0"
edition = "2021"
description = "A buck2 test executor that reports each JUnit test, not each target"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hyper-util = "0.1"
prost = "0.13"
prost-types = "0.13"
quick-xml = "0.42"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
tonic = "0.12"
tower = "0.5"

[build-dependencies]
tonic-build = "0.12"
